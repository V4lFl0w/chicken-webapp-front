<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="cache-control" content="no-cache">
    <title>Arena Strike — V-Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
        body { background:#000; overflow:hidden; touch-action:none; font-family:'Montserrat',sans-serif; }
        canvas { display:block; position:absolute; inset:0; }

        /* ── HUD ── */
        #hud {
            position:absolute; top:0; left:0; width:100%;
            padding:12px 16px;
            display:flex; justify-content:space-between; align-items:flex-start;
            pointer-events:none; z-index:10;
        }
        .hud-col { display:flex; flex-direction:column; gap:6px; }
        .hud-label { font-size:10px; font-weight:900; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:1px; }
        .hud-val   { font-size:18px; font-weight:900; color:#fff; line-height:1; }
        #hpOuter { width:130px; height:7px; background:rgba(255,255,255,0.10); border-radius:4px; overflow:hidden; margin-top:4px; }
        #hpInner { height:100%; width:100%; background:linear-gradient(90deg,#00f3ff,#00b8e6); border-radius:4px; transition:width 0.1s; }
        .coins-hud { font-size:17px; font-weight:900; color:#ffcc44; display:flex; align-items:center; gap:5px; }

        /* ── OVERLAYS ── */
        .overlay {
            position:absolute; inset:0; display:none; flex-direction:column;
            align-items:center; justify-content:center;
            background:rgba(4,7,18,0.93); backdrop-filter:blur(14px);
            z-index:100; padding:24px;
        }
        .overlay.show { display:flex; }
        .ov-title {
            font-size:28px; font-weight:900; color:#fff; text-transform:uppercase;
            text-shadow:0 0 24px rgba(0,243,255,0.7); margin-bottom:6px; text-align:center;
        }
        .ov-sub { font-size:13px; color:rgba(255,255,255,0.45); margin-bottom:28px; }

        /* ── PERK SCREEN ── */
        .perk-grid { display:flex; flex-direction:column; gap:12px; width:100%; max-width:310px; }
        .perk-card {
            background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.09);
            border-radius:18px; padding:16px 18px;
            display:flex; align-items:center; gap:14px;
            cursor:pointer; transition:border-color 0.15s, background 0.15s;
            -webkit-tap-highlight-color:transparent;
        }
        .perk-card:active { background:rgba(0,243,255,0.08); border-color:rgba(0,243,255,0.45); transform:scale(0.97); }
        .perk-icon  { font-size:26px; flex-shrink:0; }
        .perk-label { font-size:15px; font-weight:900; color:#fff; }
        .perk-desc  { font-size:11px; color:rgba(255,255,255,0.4); margin-top:2px; }

        /* ── END SCREEN ── */
        .end-result { font-size:14px; color:rgba(255,255,255,0.55); margin-bottom:4px; }
        .end-coins  { font-size:36px; font-weight:900; color:#ffcc44; margin:10px 0 28px; }
        .hub-btn {
            background:linear-gradient(135deg,#00f3ff,#0066ff); color:#071019;
            border:none; border-radius:14px; padding:14px 36px;
            font-size:15px; font-weight:900; cursor:pointer;
            text-transform:uppercase; letter-spacing:0.5px;
            box-shadow:0 8px 22px rgba(0,180,255,0.3);
        }

        /* ── HERO SELECT ── */
        #heroSelectScreen {
            background: rgba(4,7,18,0.97);
            backdrop-filter: blur(18px);
            justify-content: flex-end;
            padding-bottom: 32px;
        }
        #heroSelectScreen img {
            height: 50vh;
            object-fit: contain;
            display: block;
            flex: 1;
            min-height: 0;
            pointer-events: none;
        }
        .hero-card {
            width: calc(100% - 36px);
            max-width: 320px;
            background: linear-gradient(180deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 22px;
            padding: 20px 22px 24px;
            text-align: center;
            box-shadow: 0 24px 48px rgba(0,0,0,0.5);
        }
        .hero-name {
            font-size: 34px;
            font-weight: 900;
            color: #00f3ff;
            text-shadow: 0 0 28px rgba(0,243,255,0.65);
            letter-spacing: 3px;
            margin-bottom: 6px;
        }
        .hero-sub {
            font-size: 13px;
            color: rgba(255,255,255,0.45);
            margin-bottom: 22px;
            line-height: 1.5;
        }

        /* ── WAVE ANNOUNCE ── */
        #waveAnnounce {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            font-size:clamp(28px,7vw,42px); font-weight:900; color:#00f3ff;
            text-shadow:0 0 30px rgba(0,243,255,0.9);
            pointer-events:none; opacity:0;
            transition:opacity 0.35s;
            z-index:50; white-space:nowrap;
            max-width:85vw; overflow:hidden;
            text-align:center;
        }

        /* ── BOLT BUTTON ── */
        #boltWrap {
            position:absolute; right:20px; bottom:90px; z-index:20;
            width:60px; height:60px;
        }
        #boltBtn {
            width:60px; height:60px; border-radius:50%;
            border:2.5px solid #00f3ff;
            background:rgba(0,243,255,0.12);
            color:#00f3ff; font-size:26px;
            cursor:pointer; display:flex; align-items:center; justify-content:center;
            transition:opacity 0.2s, background 0.2s;
            -webkit-tap-highlight-color:transparent;
        }
        #boltBtn.cooldown { opacity:0.45; background:rgba(0,243,255,0.04); }
        #boltArc {
            position:absolute; top:-5px; left:-5px;
            pointer-events:none; z-index:2;
        }
    </style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
    <div class="hud-col">
        <div>
            <div class="hud-label">Волна</div>
            <div class="hud-val" id="waveNum">1 / 3</div>
        </div>
        <div>
            <div class="hud-label">HP</div>
            <div id="hpOuter"><div id="hpInner"></div></div>
        </div>
    </div>
    <div class="coins-hud">🪙 <span id="coinCount">0</span></div>
</div>

<div id="waveAnnounce"></div>

<!-- Perk selection -->
<div class="overlay" id="perkScreen">
    <div class="ov-title">Выбери усиление</div>
    <div class="ov-sub">После волны — одно улучшение</div>
    <div class="perk-grid" id="perkGrid"></div>
</div>

<!-- Hero select (shown on load) -->
<div class="overlay show" id="heroSelectScreen">
    <img src="https://coral-app-jxzy5.ondigitalocean.app/game/frontend/assets/mascot_vol.jpeg" alt="Volt">
    <div class="hero-card">
        <div class="hero-name">VOLT</div>
        <div class="hero-sub">Мастер молний. Атакует автоматически.</div>
        <button class="hub-btn" onclick="beginGame()">Играть за Volt ⚡</button>
    </div>
</div>

<!-- Game over / Victory -->
<div class="overlay" id="endScreen">
    <div class="ov-title" id="endTitle">ИГРА ОКОНЧЕНА</div>
    <div class="end-result">Волн пройдено: <span id="endWave">0</span></div>
    <div class="end-coins">🪙 <span id="endCoins">0</span></div>
    <div id="endActions" style="display:flex;flex-direction:column;gap:12px;width:100%;max-width:280px;opacity:0;pointer-events:none;transition:opacity 0.4s;">
        <button class="hub-btn" onclick="restartGame()">Играть снова ↺</button>
        <button class="hub-btn" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);color:#fff;box-shadow:none;" onclick="goHub()">◀ В Хаб</button>
    </div>
</div>

<!-- Lightning bolt ability -->
<div id="boltWrap">
    <canvas id="boltArc" width="70" height="70"></canvas>
    <button id="boltBtn">⚡</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    tg.setHeaderColor('#000');

    const BACKEND_URL = 'https://coral-app-jxzy5.ondigitalocean.app/game-api';

    // ── CANVAS ──
    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');

    let treePositions = [];
    function computeTrees() {
        const W = canvas.width, H = canvas.height;
        treePositions = [];
        const margin = 30, count = 14;
        for (let i = 0; i < count; i++) {
            const t = i / count;
            let x, y;
            if      (t < 0.25) { x = margin + (t / 0.25) * (W - margin * 2); y = margin; }
            else if (t < 0.5)  { x = W - margin; y = margin + ((t - 0.25) / 0.25) * (H - margin * 2); }
            else if (t < 0.75) { x = W - margin - ((t - 0.5) / 0.25) * (W - margin * 2); y = H - margin; }
            else               { x = margin; y = H - margin - ((t - 0.75) / 0.25) * (H - margin * 2); }
            treePositions.push({ x, y, r: 16 + Math.sin(i * 37.3) * 5 });
        }
    }
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; computeTrees(); }
    resize();
    window.addEventListener('resize', resize);

    // ── WEB AUDIO ──
    let audioCtx = null;
    function getAC() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
    }
    function playShoot() {
        try {
            const ac = getAC();
            const osc = ac.createOscillator(), g = ac.createGain();
            osc.connect(g); g.connect(ac.destination);
            osc.frequency.setValueAtTime(900, ac.currentTime);
            osc.frequency.exponentialRampToValueAtTime(180, ac.currentTime + 0.07);
            g.gain.setValueAtTime(0.1, ac.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.07);
            osc.start(); osc.stop(ac.currentTime + 0.07);
        } catch(e) {}
    }
    function playHit() {
        try {
            const ac = getAC();
            const osc = ac.createOscillator(), g = ac.createGain();
            osc.type = 'square';
            osc.connect(g); g.connect(ac.destination);
            osc.frequency.setValueAtTime(280, ac.currentTime);
            osc.frequency.exponentialRampToValueAtTime(70, ac.currentTime + 0.05);
            g.gain.setValueAtTime(0.15, ac.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.05);
            osc.start(); osc.stop(ac.currentTime + 0.05);
        } catch(e) {}
    }

    // ── VOLT SPRITE ──
    const voltImg = new Image();
    voltImg.src = 'https://coral-app-jxzy5.ondigitalocean.app/game/frontend/assets/mascot_fighter.jpeg';

    // ── BOLT ABILITY ──
    const BOLT_CD_MAX = 5;
    let boltCd = 0;
    const _boltArcEl  = document.getElementById('boltArc');
    const _boltArcCtx = _boltArcEl ? _boltArcEl.getContext('2d') : null;

    function playBolt() {
        try {
            const ac = getAC();
            const frames = Math.floor(ac.sampleRate * 0.35);
            const buf = ac.createBuffer(1, frames, ac.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < frames; i++) d[i] = (Math.random()*2-1) * Math.exp(-i/(ac.sampleRate*0.08));
            const src = ac.createBufferSource();
            const filt = ac.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=350;
            const g = ac.createGain();
            src.buffer = buf;
            src.connect(filt); filt.connect(g); g.connect(ac.destination);
            g.gain.setValueAtTime(0.55, ac.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.35);
            src.start();
        } catch(e) {}
    }

    function drawBoltArc() {
        if (!_boltArcCtx) return;
        _boltArcCtx.clearRect(0, 0, 70, 70);
        if (boltCd <= 0) return;
        const cx = 35, cy = 35, r = 30;
        const progress = 1 - boltCd / BOLT_CD_MAX;
        _boltArcCtx.beginPath();
        _boltArcCtx.arc(cx, cy, r, 0, Math.PI*2);
        _boltArcCtx.strokeStyle = 'rgba(0,243,255,0.18)';
        _boltArcCtx.lineWidth = 3;
        _boltArcCtx.stroke();
        _boltArcCtx.beginPath();
        _boltArcCtx.arc(cx, cy, r, -Math.PI/2, -Math.PI/2 + progress * Math.PI*2);
        _boltArcCtx.strokeStyle = '#00f3ff';
        _boltArcCtx.lineWidth = 3;
        _boltArcCtx.stroke();
    }

    function fireBolt() {
        if (boltCd > 0 || enemies.length === 0 || gState !== 'playing') return;
        let nearest = null, nearD = Infinity;
        enemies.forEach(en => {
            const dx = en.x - player.x, dy = en.y - player.y;
            const d = Math.sqrt(dx*dx + dy*dy);
            if (d < nearD) { nearest = en; nearD = d; }
        });
        if (!nearest) return;
        const dx = nearest.x - player.x, dy = nearest.y - player.y;
        const len = Math.sqrt(dx*dx + dy*dy) || 1;
        bullets.push({ x: player.x, y: player.y, vx: dx/len*600, vy: dy/len*600, dmg: player.dmg*3, r: 15, isBolt: true });
        boltCd = BOLT_CD_MAX;
        const btn = document.getElementById('boltBtn');
        if (btn) btn.classList.add('cooldown');
        playBolt();
    }

    document.getElementById('boltBtn').addEventListener('pointerdown', e => {
        e.stopPropagation(); fireBolt();
    });

    // ── ENEMY TYPES ──
    const ENEMY_TYPES = {
        normal: { color:'#c01835', shadowColor:'#ff2244', strokeColor:'#ff4466', hpMult:1,   spdMult:1,    dmgMult:1,   r:15, wanderInterval:0.5 },
        fast:   { color:'#ff6b35', shadowColor:'#ff4400', strokeColor:'#ff8855', hpMult:0.5, spdMult:1.8,  dmgMult:1,   r:10, wanderInterval:0.2 },
        tank:   { color:'#9b59b6', shadowColor:'#7d3c98', strokeColor:'#c39bd3', hpMult:3,   spdMult:0.45, dmgMult:1.5, r:22, wanderInterval:0.5 },
    };

    // ── WAVE DEFINITIONS ──
    const WAVES = [
        { count: 5,  hp: 30,  speed: 56,  dmg: 7,  extras: [] },
        { count: 8,  hp: 65,  speed: 74,  dmg: 11, extras: ['fast','fast','tank'] },
        { count: 12, hp: 110, speed: 92,  dmg: 15, extras: ['fast','fast','fast','tank','tank'] },
    ];

    // ── PERK POOL ──
    const PERK_POOL = [
        { icon:'❤️',  label:'+20 Здоровья',       desc:'Макс. HP +20, лечение +20',      apply: p => { p.maxHP += 20; p.hp = Math.min(p.hp + 20, p.maxHP); } },
        { icon:'⚡',  label:'Скорость атаки ×1.3', desc:'Перезарядка выстрела ×0.75',     apply: p => { p.atkCd = Math.max(0.12, p.atkCd * 0.75); } },
        { icon:'🎯',  label:'+35 Радиус атаки',    desc:'Дальность поражения +35px',      apply: p => { p.atkR += 35; } },
        { icon:'💨',  label:'Ускорение',            desc:'Скорость героя +35',             apply: p => { p.spd += 35; } },
        { icon:'⚔️',  label:'+10 Урон',             desc:'Урон каждой пули +10',           apply: p => { p.dmg += 10; } },
    ];

    // ── GAME STATE ──
    let gState  = 'intro';
    let waveIdx = 0;
    let coins   = 0;

    const player = { x:0, y:0, hp:80, maxHP:80, spd:160, atkR:120, atkCd:0.4, atkTimer:0, dmg:15, r:18 };

    let enemies   = [];
    let bullets   = [];
    let particles = [];
    let dmgNums   = [];
    let aoeRings  = [];
    let eid       = 0;

    // ── SCREEN SHAKE ──
    let shakeX = 0, shakeY = 0, shakeMag = 0, shakeTimer = 0;
    function triggerShake(mag, dur) { shakeMag = mag; shakeTimer = dur; }

    // ── JOYSTICK ──
    const JOY = { on:false, cx:0, cy:0, dx:0, dy:0, mag:0 };
    const JOY_MAX = 52, JOY_DEAD = 6;
    let joyPointerId = null;

    canvas.addEventListener('pointerdown', e => {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        else if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        if (gState !== 'playing') return;
        if (joyPointerId === null) {
            joyPointerId = e.pointerId;
            JOY.on = true; JOY.cx = e.clientX; JOY.cy = e.clientY;
            JOY.dx = 0; JOY.dy = 0; JOY.mag = 0;
            canvas.setPointerCapture(e.pointerId);
        }
    });
    canvas.addEventListener('pointermove', e => {
        if (!JOY.on || e.pointerId !== joyPointerId) return;
        const dx = e.clientX - JOY.cx, dy = e.clientY - JOY.cy;
        JOY.mag = Math.sqrt(dx*dx + dy*dy);
        const cl = Math.min(JOY.mag, JOY_MAX);
        JOY.dx = JOY.mag > 0 ? dx/JOY.mag * cl : 0;
        JOY.dy = JOY.mag > 0 ? dy/JOY.mag * cl : 0;
    });
    function releaseJoy(e) {
        if (e.pointerId !== joyPointerId) return;
        joyPointerId = null;
        JOY.on = false; JOY.dx = 0; JOY.dy = 0; JOY.mag = 0;
        player.atkTimer = 0;
    }
    canvas.addEventListener('pointerup',     releaseJoy);
    canvas.addEventListener('pointercancel', releaseJoy);

    // ── SPAWN ──
    function spawnWave(def) {
        enemies = [];
        const typeList = [];
        const extras = def.extras || [];
        const normalCount = def.count - extras.length;
        for (let i = 0; i < normalCount; i++) typeList.push('normal');
        extras.forEach(t => typeList.push(t));
        // shuffle
        for (let i = typeList.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [typeList[i], typeList[j]] = [typeList[j], typeList[i]];
        }
        for (let i = 0; i < def.count; i++) {
            const typeName = typeList[i] || 'normal';
            const td = ENEMY_TYPES[typeName];
            const side = Math.floor(Math.random() * 4);
            const pad  = 50;
            let x, y;
            if      (side === 0) { x = Math.random() * canvas.width;  y = -pad; }
            else if (side === 1) { x = canvas.width + pad;             y = Math.random() * canvas.height; }
            else if (side === 2) { x = Math.random() * canvas.width;  y = canvas.height + pad; }
            else                 { x = -pad;                           y = Math.random() * canvas.height; }
            const hp = Math.round(def.hp * td.hpMult);
            enemies.push({
                x, y,
                hp, maxHP: hp,
                spd: def.speed * td.spdMult,
                dmg: def.dmg * td.dmgMult,
                r: td.r,
                id: eid++,
                type: typeName,
                wanderAngle: 0, wanderTimer: Math.random() * td.wanderInterval,
                hitFlash: 0, dmgCooldown: 0
            });
        }
    }

    // ── PARTICLES ──
    function burst(x, y, color, n = 6) {
        for (let i = 0; i < n; i++) {
            const a = Math.random() * Math.PI * 2;
            const s = 55 + Math.random() * 110;
            particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life:0.55 + Math.random()*0.2, maxLife:0.7, r:2 + Math.random()*3, color });
        }
    }
    function deathBurst(x, y) {
        for (let i = 0; i < 6; i++) {
            const a = (i / 6) * Math.PI * 2 + Math.random() * 0.5;
            const s = 90 + Math.random() * 130;
            particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 0.6 + Math.random()*0.3, maxLife: 0.9, r: 3 + Math.random()*5, color: '#ff4466' });
        }
    }

    // ── HUD UPDATE ──
    function updateHUD() {
        document.getElementById('waveNum').textContent   = `${Math.min(waveIdx+1, WAVES.length)} / ${WAVES.length}`;
        document.getElementById('coinCount').textContent = coins;
        document.getElementById('hpInner').style.width   = Math.max(0, player.hp / player.maxHP * 100) + '%';
    }

    // ── ANNOUNCE ──
    function announce(text) {
        const el = document.getElementById('waveAnnounce');
        el.textContent = text;
        el.style.opacity = '1';
        setTimeout(() => el.style.opacity = '0', 1400);
    }

    // ── PERKS ──
    function showPerks() {
        gState = 'perk';
        const grid = document.getElementById('perkGrid');
        grid.innerHTML = '';
        const pool = [...PERK_POOL].sort(() => Math.random() - 0.5).slice(0, 3);
        pool.forEach(perk => {
            const div = document.createElement('div');
            div.className = 'perk-card';
            div.innerHTML = `<div class="perk-icon">${perk.icon}</div>
                             <div><div class="perk-label">${perk.label}</div>
                             <div class="perk-desc">${perk.desc}</div></div>`;
            div.addEventListener('pointerdown', () => {
                perk.apply(player);
                document.getElementById('perkScreen').classList.remove('show');
                nextWave();
            });
            grid.appendChild(div);
        });
        document.getElementById('perkScreen').classList.add('show');
    }

    function nextWave() {
        waveIdx++;
        if (waveIdx >= WAVES.length) { endGame(true); return; }
        gState = 'playing';
        bullets = []; dmgNums = []; aoeRings = [];
        spawnWave(WAVES[waveIdx]);
        updateHUD();
        announce(`Волна ${waveIdx + 1}`);
    }

    // ── END GAME ──
    function endGame(won) {
        gState = 'over';
        document.getElementById('endTitle').textContent = won ? 'ПОБЕДА!' : 'ИГРА ОКОНЧЕНА';
        document.getElementById('endWave').textContent  = won ? WAVES.length : waveIdx + 1;
        document.getElementById('endCoins').textContent = coins;
        document.getElementById('endScreen').classList.add('show');
        const actions = document.getElementById('endActions');
        actions.style.opacity = '0'; actions.style.pointerEvents = 'none';
        setTimeout(() => { actions.style.opacity = '1'; actions.style.pointerEvents = ''; }, 1000);
        saveCoins();
    }

    function restartGame() {
        document.getElementById('endScreen').classList.remove('show');
        Object.assign(player, { hp:80, maxHP:80, spd:160, atkR:120, atkCd:0.4, atkTimer:0, dmg:15 });
        boltCd = 0;
        const btn = document.getElementById('boltBtn');
        if (btn) btn.classList.remove('cooldown');
        drawBoltArc();
        startGame();
    }

    async function saveCoins() {
        try {
            const u = tg.initDataUnsafe?.user;
            if (!u?.id || coins === 0) return;
            await fetch(`${BACKEND_URL}/save_score`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: u.id, username: u.username || u.first_name || 'Player', score: coins, coins })
            });
        } catch(e) {}
    }

    function goHub() { window.location.href = '../../index.html'; }

    // ── HERO SELECT ──
    function beginGame() {
        const el = document.getElementById('heroSelectScreen');
        el.style.transition = 'opacity 0.3s';
        el.style.opacity = '0';
        setTimeout(() => el.classList.remove('show'), 320);
        startGame();
    }

    // ── START ──
    function startGame() {
        player.x = canvas.width / 2; player.y = canvas.height / 2;
        player.hp = player.maxHP;
        coins = 0; waveIdx = 0; gState = 'playing';
        bullets = []; particles = []; dmgNums = []; aoeRings = [];
        spawnWave(WAVES[0]);
        updateHUD();
        announce('Волна 1');
    }

    // ── DRAW TREE ──
    function drawTree(x, y, r) {
        ctx.fillStyle = '#5c3d1e';
        ctx.fillRect(x - r * 0.2, y - r * 0.3, r * 0.4, r * 0.6);
        const layers = [
            { dy: 0,        rs: r },
            { dy: -r * 0.4, rs: r * 0.75 },
            { dy: -r * 0.7, rs: r * 0.55 },
        ];
        layers.forEach(l => {
            ctx.shadowColor = '#1a4d10';
            ctx.shadowBlur = 6;
            ctx.fillStyle = '#2d6a1d';
            ctx.beginPath();
            ctx.arc(x, y + l.dy, l.rs, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.shadowBlur = 0;
    }

    // ── UPDATE ──
    function update(dt) {
        if (shakeTimer > 0) {
            shakeTimer -= dt;
            shakeX = (Math.random() - 0.5) * 2 * shakeMag;
            shakeY = (Math.random() - 0.5) * 2 * shakeMag;
            if (shakeTimer <= 0) { shakeX = 0; shakeY = 0; }
        }

        if (boltCd > 0) {
            boltCd = Math.max(0, boltCd - dt);
            drawBoltArc();
            if (boltCd === 0) {
                const btn = document.getElementById('boltBtn');
                if (btn) btn.classList.remove('cooldown');
            }
        }

        const moving = JOY.mag > JOY_DEAD;
        if (moving) {
            const nx = JOY.dx / JOY_MAX, ny = JOY.dy / JOY_MAX;
            player.x = Math.max(player.r, Math.min(canvas.width  - player.r, player.x + nx * player.spd * dt));
            player.y = Math.max(player.r, Math.min(canvas.height - player.r, player.y + ny * player.spd * dt));
        }

        player.atkTimer -= dt;
        if (player.atkTimer <= 0 && enemies.length > 0) {
            let nearest = null, nearD = Infinity;
            enemies.forEach(en => {
                const dx = en.x - player.x, dy = en.y - player.y;
                const d = Math.sqrt(dx*dx + dy*dy);
                if (d < player.atkR && d < nearD) { nearest = en; nearD = d; }
            });
            if (nearest) {
                const dx = nearest.x - player.x, dy = nearest.y - player.y;
                const len = Math.sqrt(dx*dx + dy*dy) || 1;
                const dmg = moving ? Math.round(player.dmg * 0.7) : player.dmg;
                bullets.push({ x: player.x, y: player.y, vx: dx/len * 430, vy: dy/len * 430, dmg, r: 5 });
                player.atkTimer = player.atkCd;
                burst(player.x, player.y, 'rgba(0,243,255,0.5)', 3);
                playShoot();
            }
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            if (b.x < -30 || b.x > canvas.width+30 || b.y < -30 || b.y > canvas.height+30) {
                bullets.splice(i, 1); continue;
            }
            for (let j = enemies.length - 1; j >= 0; j--) {
                const en = enemies[j];
                const dx = b.x - en.x, dy = b.y - en.y;
                if (dx*dx + dy*dy < (b.r + en.r) ** 2) {
                    if (b.isBolt) {
                        burst(b.x, b.y, '#00f3ff', 14);
                        triggerShake(5, 0.3);
                        playHit();
                        aoeRings.push({ x: b.x, y: b.y, r: 10, maxR: 80, life: 0.4, maxLife: 0.4 });
                        bullets.splice(i, 1);
                        for (let k = enemies.length - 1; k >= 0; k--) {
                            const ae = enemies[k];
                            const ax = b.x - ae.x, ay = b.y - ae.y;
                            if (ax*ax + ay*ay < 60*60) {
                                ae.hp -= b.dmg;
                                ae.hitFlash = 1;
                                dmgNums.push({ x: ae.x + (Math.random()-0.5)*14, y: ae.y - ae.r - 8, text: String(b.dmg), life: 0.8, maxLife: 0.8 });
                                if (ae.hp <= 0) {
                                    deathBurst(ae.x, ae.y);
                                    triggerShake(3, 0.2);
                                    enemies.splice(k, 1);
                                    coins += 5;
                                    updateHUD();
                                }
                            }
                        }
                    } else {
                        en.hp -= b.dmg;
                        en.hitFlash = 1;
                        dmgNums.push({ x: en.x + (Math.random()-0.5)*14, y: en.y - en.r - 8, text: String(b.dmg), life: 0.8, maxLife: 0.8 });
                        burst(b.x, b.y, '#ffcc44', 4);
                        playHit();
                        bullets.splice(i, 1);
                        if (en.hp <= 0) {
                            deathBurst(en.x, en.y);
                            triggerShake(3, 0.2);
                            enemies.splice(j, 1);
                            coins += 5;
                            updateHUD();
                        }
                    }
                    break;
                }
            }
        }

        enemies.forEach(en => {
            const td = ENEMY_TYPES[en.type || 'normal'];
            en.wanderTimer -= dt;
            if (en.wanderTimer <= 0) {
                en.wanderAngle = (Math.random() - 0.5) * (Math.PI / 3);
                en.wanderTimer = td.wanderInterval;
            }
            en.hitFlash    = Math.max(0, en.hitFlash - dt * 25);
            en.dmgCooldown = Math.max(0, en.dmgCooldown - dt);
            const dx = player.x - en.x, dy = player.y - en.y;
            const len = Math.sqrt(dx*dx + dy*dy) || 1;
            const moveAngle = Math.atan2(dy, dx) + en.wanderAngle;
            en.x += Math.cos(moveAngle) * en.spd * dt;
            en.y += Math.sin(moveAngle) * en.spd * dt;
            if (len < player.r + en.r + 2 && en.dmgCooldown <= 0) {
                player.hp = Math.max(0, player.hp - en.dmg);
                en.dmgCooldown = 0.8;
                updateHUD();
                if (player.hp <= 0) endGame(false);
            }
        });

        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.life -= dt;
            if (p.life <= 0) { particles.splice(i, 1); continue; }
            p.x += p.vx * dt; p.y += p.vy * dt;
            p.vx *= 0.90; p.vy *= 0.90;
        }

        for (let i = dmgNums.length - 1; i >= 0; i--) {
            const d = dmgNums[i];
            d.life -= dt;
            if (d.life <= 0) { dmgNums.splice(i, 1); continue; }
            d.y -= 45 * dt;
        }

        for (let i = aoeRings.length - 1; i >= 0; i--) {
            const ring = aoeRings[i];
            ring.life -= dt;
            if (ring.life <= 0) { aoeRings.splice(i, 1); continue; }
            ring.r += (ring.maxR - ring.r) * dt * 6;
        }

        if (gState === 'playing' && enemies.length === 0) {
            gState = 'waveclear';
            coins += 25;
            updateHUD();
            announce('Волна пройдена!');
            setTimeout(showPerks, 1000);
        }
    }

    // ── RENDER ──
    function render() {
        const W = canvas.width, H = canvas.height;

        ctx.save();
        ctx.translate(shakeX, shakeY);

        // Green arena ground
        ctx.fillStyle = '#0a1a0f';
        ctx.fillRect(-6, -6, W+12, H+12);

        // Tile grid
        ctx.strokeStyle = '#1a2e1a';
        ctx.lineWidth = 1;
        for (let x = -6; x < W+80; x += 80) { ctx.beginPath(); ctx.moveTo(x, -6); ctx.lineTo(x, H+6); ctx.stroke(); }
        for (let y = -6; y < H+80; y += 80) { ctx.beginPath(); ctx.moveTo(-6, y); ctx.lineTo(W+6, y); ctx.stroke(); }

        // Center zone glow
        const cg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.min(W,H)*0.35);
        cg.addColorStop(0, '#0f2010');
        cg.addColorStop(1, 'rgba(15,32,16,0)');
        ctx.fillStyle = cg;
        ctx.fillRect(-6, -6, W+12, H+12);

        // Perimeter trees
        treePositions.forEach(t => drawTree(t.x, t.y, t.r));

        // Attack radius ring
        if (!JOY.on || JOY.mag <= JOY_DEAD) {
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.atkR, 0, Math.PI*2);
            ctx.strokeStyle = 'rgba(0,243,255,0.09)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        // Particles
        particles.forEach(p => {
            ctx.globalAlpha = p.life / p.maxLife;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;

        // AOE rings
        aoeRings.forEach(ring => {
            ctx.globalAlpha = (ring.life / ring.maxLife) * 0.75;
            ctx.strokeStyle = '#00f3ff';
            ctx.shadowColor = '#00f3ff';
            ctx.shadowBlur = 18;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI*2);
            ctx.stroke();
            ctx.shadowBlur = 0;
        });
        ctx.globalAlpha = 1;

        // Bullets — cyan line arrows
        bullets.forEach(b => {
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(Math.atan2(b.vy, b.vx));
            ctx.lineCap = 'round';
            if (b.isBolt) {
                ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 28;
                ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.stroke();
            } else {
                ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 14;
                ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.stroke();
            }
            ctx.restore();
        });
        ctx.shadowBlur = 0;

        // Enemies
        enemies.forEach(en => {
            const td = ENEMY_TYPES[en.type || 'normal'];
            if (en.hitFlash > 0) {
                ctx.globalAlpha = en.hitFlash * 0.85;
                ctx.fillStyle = '#ff8888';
                ctx.beginPath(); ctx.arc(en.x, en.y, en.r + 2, 0, Math.PI*2); ctx.fill();
                ctx.globalAlpha = 1;
            }
            ctx.shadowColor = td.shadowColor; ctx.shadowBlur = 10;
            ctx.fillStyle = td.color;
            ctx.beginPath(); ctx.arc(en.x, en.y, en.r, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = td.strokeColor; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(en.x, en.y, en.r, 0, Math.PI*2); ctx.stroke();
            const bw = en.r * 2.2, bx = en.x - bw/2, by = en.y - en.r - 9;
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.fillRect(bx, by, bw, 4);
            ctx.fillStyle = en.hp / en.maxHP > 0.4 ? '#37d67a' : '#ff5b77';
            ctx.fillRect(bx, by, bw * (en.hp / en.maxHP), 4);
        });

        // Player sprite — 60×90 rectangular, no clip
        ctx.save();
        ctx.shadowColor = '#00f3ff'; ctx.shadowBlur = 20;
        if (voltImg.complete && voltImg.naturalWidth > 0) {
            ctx.drawImage(voltImg, player.x - 30, player.y - 45, 60, 90);
        } else {
            ctx.fillStyle = '#00394d';
            ctx.fillRect(player.x - 30, player.y - 45, 60, 90);
        }
        ctx.restore();
        ctx.shadowBlur = 0;

        // Damage numbers
        ctx.font = 'bold 15px Montserrat, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        dmgNums.forEach(d => {
            ctx.globalAlpha = d.life / d.maxLife;
            ctx.fillStyle = '#fff';
            ctx.fillText(d.text, d.x, d.y);
        });
        ctx.globalAlpha = 1;

        // Joystick
        if (JOY.on) {
            ctx.globalAlpha = 0.22;
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(JOY.cx, JOY.cy, JOY_MAX, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 0.6;
            ctx.fillStyle = '#00f3ff';
            ctx.beginPath(); ctx.arc(JOY.cx + JOY.dx, JOY.cy + JOY.dy, 24, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1;
        }

        ctx.restore();
    }

    // ── LOOP ──
    let last = 0;
    function loop(ts) {
        const dt = Math.min((ts - last) / 1000, 0.05);
        last = ts;
        if (gState === 'playing') update(dt);
        render();
        requestAnimationFrame(loop);
    }

    requestAnimationFrame(ts => { last = ts; requestAnimationFrame(loop); });
</script>
</body>
